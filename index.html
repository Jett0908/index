<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký gói cước di động</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .designer {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #2575fc;
            box-shadow: 0 0 0 2px rgba(37, 117, 252, 0.2);
            outline: none;
        }
        
        .btn {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }
        
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .package-info {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f8ff;
            border-radius: 8px;
            border-left: 4px solid #2575fc;
            display: none;
        }
        
        .package-info h3 {
            margin-bottom: 10px;
            color: #2575fc;
        }
        
        .package {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            background-color: white;
            border: 1px solid #e1e5e9;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .package:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            border-color: #2575fc;
        }
        
        .package.selected {
            background-color: #e6f2ff;
            border-color: #2575fc;
        }
        
        .package-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #2575fc;
        }
        
        .package-code {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .package-desc {
            font-size: 14px;
            color: #444;
            margin-bottom: 5px;
        }
        
        .package-price {
            font-weight: bold;
            color: #e74c3c;
            margin-top: 5px;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
        }
        
        .network-info {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }
        
        .viettel {
            background-color: #e6f2ff;
            color: #0066cc;
            border: 1px solid #b3d9ff;
        }
        
        .vinaphone {
            background-color: #fff0e6;
            color: #cc6600;
            border: 1px solid #ffcc99;
        }
        
        .mobifone {
            background-color: #f0e6ff;
            color: #6600cc;
            border: 1px solid #d9b3ff;
        }
        
        .other {
            background-color: #e6ffe6;
            color: #006600;
            border: 1px solid #b3ffb3;
        }
        
        @media (max-width: 480px) {
            .container {
                border-radius: 10px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ĐĂNG KÝ GÓI CƯỚC DI ĐỘNG</h1>
            <div class="designer">Designer: Hoai An</div>
        </div>
        
        <div class="content">
            <!-- Bước 1: Nhập số điện thoại và số dư -->
            <div class="step active" id="step1">
                <form id="phoneForm">
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="text" id="phone" placeholder="Nhập số điện thoại của bạn" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="balance">Số dư tài khoản (VNĐ)</label>
                        <input type="number" id="balance" placeholder="Nhập số dư tài khoản" required>
                    </div>
                    
                    <button type="submit" class="btn">KIỂM TRA VÀ CHỌN GÓI CƯỚC</button>
                </form>
            </div>
            
            <!-- Bước 2: Chọn gói cước -->
            <div class="step" id="step2">
                <div id="networkInfo" class="network-info"></div>
                
                <div class="package-info" id="packageInfo">
                    <h3>CHỌN GÓI CƯỚC PHÙ HỢP</h3>
                    <div id="packagesList"></div>
                </div>
                
                <button id="backBtn" class="btn btn-secondary">QUAY LẠI</button>
            </div>
            
            <!-- Kết quả đăng ký -->
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        // Các gói cước theo nhà mạng (theo đúng hình ảnh)
        const packages = {
            'Viettel': [
                {code: '3175', name: 'Gói 3175', price: 7000, desc: '7000đ/ngày - 1GB/ngày'},
                {code: '3570', name: 'Gói 3570', price: 700000, desc: '700000đ/ngày - 868/ngày'},
                {code: '5628', name: 'Gói 5628', price: 290000, desc: '290000đ/ngày - 4GB/ngày + 80 phút gọi điện, 803MS nội mạng'},
                {code: '5630', name: 'Gói 5630', price: 900000, desc: '900000đ/ngày - 768/ngày'},
                {code: '56131', name: 'Gói 56131', price: 1335000, desc: '1335000đ/ngày - 4GB/ngày'}
            ],
            'Vinaphone': [
                {code: '8055', name: 'Gói 8055', price: 50000, desc: '50000đ/ngày - 1GB/ngày'},
                {code: '07', name: 'Gói 07', price: 70000, desc: '70000đ/ngày - 1.2GB/ngày'},
                {code: '6144', name: 'Gói 6144', price: 40000, desc: '40000đ/ngày - 2GB/ngày - 1000 phút gọi nội mạng'},
                {code: '4824', name: 'Gói 4824', price: 40000, desc: '40000đ/ngày - 2GB/ngày - 1000 phút gọi nội mạng - miễn phí Facebook và MyTV'},
                {code: '81690', name: 'Gói 81690', price: 900000, desc: '900000đ/ngày - 1GB/ngày - miễn phí xem MyTV OTT'}
            ],
            'Mobifone': [
                {code: 'MBF1', name: 'Gói Mobi1', price: 10000, desc: '10000đ/ngày - 500MB/ngày'},
                {code: 'MBF2', name: 'Gói Mobi2', price: 20000, desc: '20000đ/ngày - 1GB/ngày'},
                {code: 'MBF3', name: 'Gói Mobi3', price: 50000, desc: '50000đ/ngày - 2GB/ngày + 100 phút gọi'},
            ],
            'Other': [
                {code: 'GTEL1', name: 'Gói GTEL1', price: 15000, desc: '15000đ/ngày - 700MB/ngày'},
                {code: 'GTEL2', name: 'Gói GTEL2', price: 30000, desc: '30000đ/ngày - 1.5GB/ngày'},
            ]
        };

        // Tiền tố số điện thoại theo nhà mạng
        const viettelPrefixes = ['032', '033', '034', '035', '036', '037', '038', '039', '086', '096', '097', '098'];
        const vinaphonePrefixes = ['081', '082', '083', '084', '085', '088', '091', '094'];
        const mobifonePrefixes = ['070', '076', '077', '078', '079', '089', '090', '093'];

        // Biến toàn cục
        let currentPhone = '';
        let currentBalance = 0;
        let currentNetwork = '';
        let selectedPackage = null;

        // Xử lý form nhập số điện thoại và số dư
        document.getElementById('phoneForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            currentPhone = document.getElementById('phone').value;
            currentBalance = parseInt(document.getElementById('balance').value);
            
            // Kiểm tra số điện thoại
            const phonePrefix = currentPhone.substring(0, 3);
            
            if (viettelPrefixes.includes(phonePrefix)) {
                currentNetwork = 'Viettel';
            } else if (vinaphonePrefixes.includes(phonePrefix)) {
                currentNetwork = 'Vinaphone';
            } else if (mobifonePrefixes.includes(phonePrefix)) {
                currentNetwork = 'Mobifone';
            } else {
                currentNetwork = 'Other';
            }
            
            // Hiển thị thông tin nhà mạng
            const networkInfo = document.getElementById('networkInfo');
            networkInfo.textContent = `Số điện thoại ${currentPhone} thuộc nhà mạng ${currentNetwork}`;
            networkInfo.className = `network-info ${currentNetwork.toLowerCase()}`;
            
            // Hiển thị các gói cước phù hợp
            displayPackages(currentNetwork);
            
            // Chuyển sang bước 2
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('packageInfo').style.display = 'block';
        });

        // Hiển thị các gói cước theo nhà mạng
        function displayPackages(network) {
            const packagesList = document.getElementById('packagesList');
            packagesList.innerHTML = '';
            
            const networkPackages = packages[network] || [];
            
            if (networkPackages.length === 0) {
                packagesList.innerHTML = '<p>Không có gói cước nào phù hợp với nhà mạng của bạn.</p>';
                return;
            }
            
            networkPackages.forEach(pkg => {
                const packageElement = document.createElement('div');
                packageElement.className = 'package';
                packageElement.innerHTML = `
                    <div class="package-title">${pkg.name}</div>
                    <div class="package-code">Mã gói: ${pkg.code}</div>
                    <div class="package-desc">${pkg.desc}</div>
                    <div class="package-price">Giá: ${pkg.price.toLocaleString('vi-VN')} VNĐ</div>
                `;
                
                packageElement.addEventListener('click', function() {
                    // Bỏ chọn tất cả các gói khác
                    document.querySelectorAll('.package').forEach(p => {
                        p.classList.remove('selected');
                    });
                    
                    // Chọn gói này
                    packageElement.classList.add('selected');
                    selectedPackage = pkg;
                    
                    // Kích hoạt nút đăng ký
                    document.getElementById('registerBtn').disabled = false;
                });
                
                packagesList.appendChild(packageElement);
            });
            
            // Thêm nút đăng ký
            const registerBtn = document.createElement('button');
            registerBtn.id = 'registerBtn';
            registerBtn.className = 'btn';
            registerBtn.textContent = 'ĐĂNG KÝ GÓI CƯỚC';
            registerBtn.disabled = true;
            registerBtn.addEventListener('click', registerPackage);
            
            packagesList.appendChild(registerBtn);
        }

        // Xử lý đăng ký gói cước
        function registerPackage() {
            if (!selectedPackage) {
                alert('Vui lòng chọn một gói cước!');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            
            // Kiểm tra số dư
            if (currentBalance < selectedPackage.price) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Bạn không có đủ tiền, xin hãy nhập lại số dư tài khoản.';
                resultDiv.style.display = 'block';
                return;
            }
            
            // Tính số tiền còn lại
            const remainingBalance = currentBalance - selectedPackage.price;
            
            // Hiển thị kết quả thành công
            resultDiv.className = 'result success';
            resultDiv.innerHTML = `
                <strong>Đăng ký thành công!</strong><br><br>
                Số điện thoại: <strong>${currentPhone}</strong><br>
                Nhà mạng: <strong>${currentNetwork}</strong><br>
                Gói cước: <strong>${selectedPackage.name} (${selectedPackage.code})</strong><br>
                Giá gói: <strong>${selectedPackage.price.toLocaleString('vi-VN')} VNĐ</strong><br><br>
                <strong>Đăng ký thành công bạn còn dư ${remainingBalance.toLocaleString('vi-VN')} VNĐ</strong>
            `;
            resultDiv.style.display = 'block';
            
            // Ẩn bước 2
            document.getElementById('step2').classList.remove('active');
        }

        // Xử lý nút quay lại
        document.getElementById('backBtn').addEventListener('click', function() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('result').style.display = 'none';
            // Reset form
            document.getElementById('phoneForm').reset();
            selectedPackage = null;
        });
    </script>
</body>
</html>
